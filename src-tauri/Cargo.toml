[package]
name = "pi-session-viewer"
version = "0.1.9"
description = "Desktop browser + chat for pi coding agent sessions"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "pi_session_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder", "NSApplication"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSURL", "NSData", "NSString", "NSError"] }

[dependencies.getrandom]
version = "=0.3.4"
