[package]
name = "pi-session-viewer"
version = "0.1.0"
description = "Desktop browser + chat for pi coding agent sessions"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "pi_session_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
